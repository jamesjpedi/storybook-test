# BHHC design system — Azure DevOps pipeline
#
# Quality gates run as npm prebuild hooks on changed files only (no --fix).
# `npm run build:lib` / `build-storybook` fail if ESLint, Prettier, or typecheck fail.
# Versioning gates enforce cherry-pick promotion:
#   development (no version) → qa/<slug> → qa (x.y.z-qa.N)
#   → release:<slug> (x.y.z-<slug>.N) → master (x.y.z)
# Tags: vX.Y.Z, vX.Y.Z-qa.N, or vX.Y.Z-<slug>.N.
#
# Required pipeline (secret) variable:
#   MUI_X_LICENSE_KEY  — MUI X Premium license; inlined into the published package
#
# Required for the Publish stage (Azure Artifacts):
#   npmFeed            — Artifacts feed name (org- or project-scoped)
#                        Override in the pipeline UI if it is not `bhhc-design-system`.
#
# Grant the project Build Service "Contributor" on the feed so npm publish can write.
# Publish runs only on tags matching v* produced by `npm run release`.
# Dist-tags: qa → qa, release slug → that slug, stable → latest.

trigger:
  branches:
    include:
      - development
      - qa
      - qa/*
      - master
      - main
      - release/*
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - development
      - qa
      - master
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  npmFeed: 'bhhc-design-system'

stages:
  - stage: Build
    displayName: Check and build
    jobs:
      - job: Ci
        displayName: CI
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
            displayName: Checkout (full history for Commitlint and versioning)

          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - script: npm ci --cache $(Pipeline.Workspace)/.npm --prefer-offline
            displayName: npm ci
            env:
              HUSKY: '0'

          - bash: |
              set -euo pipefail
              TARGET_REF="${SYSTEM_PULLREQUEST_TARGETBRANCH}"
              TARGET="${TARGET_REF#refs/heads/}"
              git fetch --quiet origin "$TARGET"
              npx commitlint --from "origin/${TARGET}" --to HEAD --verbose
            displayName: Commitlint (PR commits)
            condition: eq(variables['Build.Reason'], 'PullRequest')

          - script: node scripts/versioning/check-flow.mjs --ci
            displayName: Version flow (cherry-pick promotion)

          - script: npm run test:versioning
            displayName: Versioning unit tests

          - bash: |
              set -euo pipefail
              TAG="$(node scripts/versioning/dist-tag.mjs)"
              echo "npm dist-tag: ${TAG}"
              echo "##vso[task.setvariable variable=npmDistTag;isOutput=true]${TAG}"
            name: VersionMeta
            displayName: Resolve npm dist-tag

          - script: npm run build:lib
            displayName: Check (fail-only) and build library
            env:
              MUI_X_LICENSE_KEY: $(MUI_X_LICENSE_KEY)

          - script: npm run build-storybook
            displayName: Check (fail-only) and build Storybook

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/npm"
              mkdir -p "$STAGE"
              cp package.json README.md GETTING_STARTED.md CHANGELOG.md "$STAGE/"
              cp -R dist "$STAGE/dist"
            displayName: Stage npm package (no node_modules)

          - task: PublishPipelineArtifact@1
            displayName: Publish npm package artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/npm
              artifact: package
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish Storybook static site
            inputs:
              targetPath: $(Build.SourcesDirectory)/storybook-static
              artifact: storybook
              publishLocation: pipeline

  - stage: Publish
    displayName: Publish npm package
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    variables:
      npmDistTag: $[stageDependencies.Build.Ci.outputs['VersionMeta.npmDistTag']]
    jobs:
      - job: Npm
        displayName: Azure Artifacts
        steps:
          - download: current
            artifact: package

          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - bash: |
              set -euo pipefail
              TAG="$(npmDistTag)"
              if [ -z "${TAG}" ]; then
                echo "npm dist-tag was not set by the Build stage."
                exit 1
              fi
              echo "Publishing bhhc-design-system with dist-tag ${TAG}"
            displayName: Confirm npm dist-tag

          # dist is already signed in Build. Skip prepublishOnly (it would rebuild).
          - script: npm pkg delete scripts.prepublishOnly
            displayName: Skip rebuild on publish
            workingDirectory: $(Pipeline.Workspace)/package

          - task: Npm@1
            displayName: Publish bhhc-design-system
            inputs:
              command: custom
              customCommand: publish --tag $(npmDistTag)
              workingDir: $(Pipeline.Workspace)/package
              customRegistry: useFeed
              customFeed: $(npmFeed)
